spring.application.name=backend
server.port=${PORT:5000}

spring.datasource.url=${DATABASE_URL:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

google.client.id=${GOOGLE_CLIENT_ID:not-set}
google.client.secret=${GOOGLE_CLIENT_SECRET:not-set}

gemini.api.key=${GEMINI_API_KEY:not-set}

spring.session.store-type=none
server.servlet.session.cookie.name=session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true

cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
